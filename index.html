<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMORPG Stress Test Showcase</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "websim": "https://unpkg.com/websim@0.0.7/dist/websim.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="container">
      <h1>MMORPG Stress Test</h1>
      <div id="status">Connecting...</div>
      <div id="metrics">
          <span>FPS: 0</span> |
          <span>Visual Agents: 0</span> |
          <span>Real Peers: 0</span> |
          <span>Presence Sent: 0</span>
      </div>

      <canvas id="simulation-canvas" width="800" height="600"></canvas>

      <div id="controls">
        <button id="start-stop-sim-button">Stop Simulation</button>
        <label>
          Visual Agents:
          <input type="number" id="num-agents-input" min="0" max="2000" step="10" value="100">
        </label>
        <button id="load-presence-button">Load Test (Presence)</button>
        <!-- <button id="load-room-state-button">Load Test (Room State)</button> -->
        <!-- Add more controls as needed -->
      </div>

      <div id="peers-list-container">
        <h2>Connected Peers</h2>
        <div id="peers-list"></div>
      </div>

      <pre id="debug-log"></pre>
    </div>

    <script type="module" src="config.js"></script>
    <script type="module" src="main.js"></script>

</body>
</html>
